name: Update BTC USD
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bitstamp-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and update
        run: python3 scripts/update.py
      - name: Publish validated snapshot
        run: |
          git config user.name "MIS Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update completed BTC USD candles" && git push)
